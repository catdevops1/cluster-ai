name: Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ORG: catdevops1

jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: |
      contains(toJson(github.event.commits.*.modified), 'backend/') ||
      contains(toJson(github.event.commits.*.added), 'backend/') ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: false
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      - name: Log in to GHCR
        uses: docker/login-action@v3
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API
        uses: docker/build-push-action@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          no-cache: true
          tags: |
            ghcr.io/${{ env.ORG }}/cluster-ai-api:latest
            ghcr.io/${{ env.ORG }}/cluster-ai-api:${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: |
      contains(toJson(github.event.commits.*.modified), 'frontend/') ||
      contains(toJson(github.event.commits.*.added), 'frontend/') ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      - name: Log in to GHCR
        uses: docker/login-action@v3
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          no-cache: true
          tags: |
            ghcr.io/${{ env.ORG }}/cluster-ai-frontend:latest
            ghcr.io/${{ env.ORG }}/cluster-ai-frontend:${{ github.sha }}
