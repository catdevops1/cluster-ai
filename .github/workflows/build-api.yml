name: Build API

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/build-api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  ORG: catdevops1

jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          no-cache: true
          tags: |
            ghcr.io/${{ env.ORG }}/cluster-ai-api:latest
            ghcr.io/${{ env.ORG }}/cluster-ai-api:${{ github.sha }}
